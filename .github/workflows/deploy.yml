name: Deploy with minification

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Minification Tools
        run: npm install -g terser csso-cli

      - name: Minify js
        run: |
          find . -name "*.js" ! -name "*.min.js" -exec terser {} -o {} -c -m \;

      - name: Minify css
        run: |
          find . -name "*.css" ! -name "*.min.css" -exec csso {} -o {} \;

      - name: Minify html
        run: |
          find . -name "*.html" -exec html-minifier-terser {} -o {} --collapse-whitespace --remove-comments \;

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy my page
        id: deployment
        uses: actions/deploy-pages@v4
